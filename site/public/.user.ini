; Лимиты PHP для загрузки фото из админки (Reg.ru читает .user.ini из корня сайта)
upload_max_filesize = 25M
post_max_size = 100M
max_file_uploads = 30
memory_limit = 512M
; ошибки — в журнал, не на экран посетителю (там пути к файлам и детали базы)
display_errors = Off
log_errors = On
; cookie сессии админки — только по HTTP, без доступа из скриптов
session.cookie_httponly = 1
session.use_strict_mode = 1
