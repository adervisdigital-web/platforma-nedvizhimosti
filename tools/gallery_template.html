<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стиль Платформы</title>
<meta name="description" content="ПЛАТФОРМА НЕДВИЖИМОСТИ — три варианта фирменного стиля: светлый, тёмный, яркий.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600&family=Unbounded:wght@600&family=Geologica:wght@700&family=Golos+Text:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3EF;--card:#FFFFFF;--ink:#17181A;--muted:#64666B;--line:#E2DFD8;--soft:#ECE9E3;--brand:#17181A;--brand-ink:#FFFFFF;--focus:#2E4BFF;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111214;--card:#1A1B1E;--ink:#F1F0EC;--muted:#A3A5AA;--line:#2C2E33;--soft:#23252A;--brand:#F1F0EC;--brand-ink:#111214;--focus:#8FA0FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111214;--card:#1A1B1E;--ink:#F1F0EC;--muted:#A3A5AA;--line:#2C2E33;--soft:#23252A;--brand:#F1F0EC;--brand-ink:#111214;--focus:#8FA0FF;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Manrope,system-ui,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap;padding:8px 16px}
.brand{font:800 15px Manrope,sans-serif;letter-spacing:.06em;white-space:nowrap}
.brand small{display:block;font:500 11px Manrope,sans-serif;letter-spacing:.08em;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.tabs button,.seg button,.chip{border:1px solid transparent;background:transparent;padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;min-height:40px}
nav.tabs button:hover,.seg button:hover,.chip:hover{background:var(--soft)}
nav.tabs button[aria-current="true"],.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;min-width:40px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:600;font-size:14px}
.icon-btn:hover{background:var(--soft)}
main.wrap{padding:44px 16px 96px}
h1{font:800 clamp(32px,5vw,56px)/1.02 Manrope,sans-serif;letter-spacing:-.025em;margin:0 0 12px}
h2{font:700 clamp(22px,3vw,30px)/1.15 Manrope,sans-serif;letter-spacing:-.015em;margin:48px 0 16px}
h3{font:700 18px Manrope,sans-serif;margin:0 0 8px}
p.lead{color:var(--muted);max-width:760px;margin:0 0 28px;font-size:17px}
.kick{font:700 12px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.vcard .stage{height:240px;display:flex;align-items:center;justify-content:center}
.vcard .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px}
.vcard .t{font:700 20px Manrope,sans-serif}
.vcard p{margin:0;color:var(--muted);font-size:15px}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.strip button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;background:var(--soft);aspect-ratio:3/3.6}
.strip img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.strip button:hover{outline:2px solid var(--ink);outline-offset:1px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:block}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
/* marks */
.mk{display:block;overflow:visible;width:100%;height:auto}
.mL .p1{fill:var(--m1)}
.mD .p1{fill:var(--m1)}.mD .p2{fill:var(--m2)}.mD .p3{fill:var(--m3)}.mD .p4{fill:var(--m4)}
.mM .p1{fill:var(--m1)}.mM .p2{fill:var(--m2)}
.play .mM rect{animation:drop .45s cubic-bezier(.2,.8,.2,1) both}
.play .mM rect:nth-child(2){animation-delay:.42s}.play .mM rect:nth-child(3){animation-delay:.08s}.play .mM rect:nth-child(4){animation-delay:.14s}.play .mM rect:nth-child(5){animation-delay:.2s}.play .mM rect:nth-child(6){animation-delay:.26s}.play .mM rect:nth-child(7){animation-delay:.32s}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.mY .p1{fill:var(--m1)}.mY .p2{fill:var(--m2)}.mY .p3{fill:var(--m3)}
.play .mL{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.play .mD .p1{animation:fade .5s ease both}
.play .mD .p2{animation:slideD .5s .35s cubic-bezier(.2,.8,.2,1) both}
.play .mD .p3{animation:slideD .5s .5s cubic-bezier(.2,.8,.2,1) both}
.play .mD .p4{animation:glow 1.1s .9s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideD{from{opacity:0;transform:translate(-4px,4px)}to{opacity:1;transform:none}}
@keyframes glow{0%{opacity:0}30%{opacity:1}45%{opacity:.35}60%{opacity:1}100%{opacity:1}}
.play .mY .p1{animation:inL .6s cubic-bezier(.2,.8,.2,1) both}
.play .mY .p2{animation:inT .6s .15s cubic-bezier(.2,.8,.2,1) both}
.play .mY .p3{animation:inR .6s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes inT{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.play *{animation:none!important}}
/* playground */
.pg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
@media (max-width:900px){.pg{grid-template-columns:1fr}}
.pg .stage{position:relative;min-height:420px;overflow:hidden;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:32px;background-size:cover;background-position:center}
.pg .stage.photo::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.42)}
.lock{position:relative;display:flex;align-items:center;gap:.42em}
.lock .mwrap{position:relative;flex:none}
.lock .mwrap .grid{position:absolute;stroke:currentColor;stroke-width:.18;stroke-dasharray:.8 .8;fill:none;opacity:0;transition:opacity .25s;pointer-events:none}
.lock.showgrid .grid{opacity:.55}
.words{display:inline-flex;flex-direction:column;gap:.16em;line-height:.9}
.words .w{white-space:nowrap}
.words .s{display:flex;justify-content:space-between;width:0;min-width:100%;font:500 .24em Manrope,sans-serif;line-height:1}
.lock.only .words{display:none}
.ctrl{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px}
.ctrl label,.ctrl .lab{font:700 12px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--soft);padding:4px;border-radius:16px}
.seg button{padding:8px 6px;font-size:13px;min-height:36px;border-radius:12px}
input[type=range]{width:100%;accent-color:var(--ink);min-height:32px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:14px;min-height:36px;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--ink)}
.dl a{font-size:14px;font-weight:600}
/* palette */
.pal{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sw-c{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);cursor:pointer;text-align:left;padding:0}
.sw-c span{display:block;height:84px}
.sw-c b{display:block;padding:10px 12px 0;font-size:14px}
.sw-c em{display:block;padding:0 12px 10px;font-style:normal;color:var(--muted);font-size:13px;font-family:ui-monospace,monospace}
/* sheets */
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.lock{transform-origin:center center;transition:transform .15s}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:zoom-in;padding:0;text-align:left}
.sheet img{display:block;width:100%;aspect-ratio:3/3.4;object-fit:cover;object-position:top}
.sheet div{padding:10px 14px;font-weight:700;font-size:15px}
.sheet small{display:block;color:var(--muted);font-weight:500;font-size:12px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:12px 14px;font:inherit;resize:vertical}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:#0B0B0D;display:none;flex-direction:column;color:#fff}
.lb.open{display:flex}
.lb .tb{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.lb .tb .t{flex:1;font-weight:700;min-width:160px}
.lb .tb button,.lb .tb a{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:999px;min-height:40px;min-width:40px;padding:0 14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.lb .tb button:hover,.lb .tb a:hover{background:rgba(255,255,255,.2)}
.lb .vp{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;cursor:zoom-in;touch-action:none}
.lb .vp img{max-width:96vw;max-height:calc(100vh - 80px);display:block;user-select:none;-webkit-user-drag:none}
.lb .vp.z{overflow:auto;display:block;cursor:grab}
.lb .vp.z img{max-width:none;max-height:none;margin:0 auto}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:22px;cursor:pointer;z-index:2}
.lb .nav.l{left:12px}.lb .nav.r{right:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:640px){
  .bar{flex-wrap:wrap;gap:8px 12px;min-height:0;padding:10px 16px 8px}
  .seg{grid-template-columns:repeat(4,minmax(0,1fr))}
  .seg button{font-size:12px;padding:8px 2px}
  .brand{order:1;flex:1}
  #theme{order:2}
  nav.tabs{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px;gap:6px}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:none;white-space:nowrap;border:1px solid var(--line);padding:8px 14px}
  main.wrap{padding:24px 16px 64px}
  h1{font-size:clamp(28px,8.5vw,36px)}
  h2{margin:36px 0 12px}
  p.lead{font-size:16px;margin-bottom:20px}
  .grid3{grid-template-columns:1fr;gap:16px}
  .vcard .stage{height:180px}
  .vcard .stage>div{width:96px!important}
  .pg .stage{min-height:240px;padding:20px;border-radius:16px}
  .ctrl{padding:14px;gap:12px;border-radius:16px}
  .pal{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .sw-c span{height:64px}
  .sheets{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .sheet div{padding:8px 10px;font-size:13px}
  .links .btn{flex:1}
  .lb .tb{padding:8px 10px;gap:6px}
  .lb .tb .t{font-size:13px;min-width:0;flex:1 1 100%;order:-1}
  .lb .tb button,.lb .tb a{min-height:38px;padding:0 12px;font-size:13px}
  .lb .vp img{max-width:100vw;max-height:calc(100vh - 110px)}
  .lb .nav{width:40px;height:40px;font-size:20px;top:auto;bottom:16px;transform:none}
  .lb .nav.l{left:16px}.lb .nav.r{right:16px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">ПЛАТФОРМА<small>НЕДВИЖИМОСТИ · СТИЛЬ</small></div>
    <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
    <button class="icon-btn" id="theme" type="button" aria-label="Сменить тему страницы">◐</button>
  </div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Просмотр листа">
  <div class="tb">
    <span class="t" id="lbT"></span>
    <span id="lbN" class="muted"></span>
    <button type="button" id="lbZ" aria-label="Увеличить до 100%">100%</button>
    <a id="lbD" href="#" download aria-label="Скачать PNG">Скачать</a>
    <button type="button" id="lbX" aria-label="Закрыть">✕</button>
  </div>
  <div class="vp" id="lbV"><img id="lbI" alt=""></div>
  <button class="nav l" type="button" id="lbP" aria-label="Предыдущий лист">‹</button>
  <button class="nav r" type="button" id="lbNx" aria-label="Следующий лист">›</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/*DATA*/
const $ = (s, el = document) => el.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('pn-' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pn-' + k, v); } catch (e) {} }
};
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); }
function copyFallback(text) {
  const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} t.remove(); return ok;
}
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg || 'Скопировано'); }
  catch (e) { toast(copyFallback(text) ? (msg || 'Скопировано') : 'Скопируйте вручную: ' + text.slice(0, 40)); }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

/* theme */
(function () {
  const t = store.get('theme', null); if (t) document.documentElement.dataset.theme = t;
  $('#theme').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; store.set('theme', nx);
  };
})();

/* mark colours per variant and background */
function markVars(v, bg) {
  if (v.mv) return v.mv[bg] || v.mv.light;
  if (v.key === 'L') return {m1: bg === 'brand' ? '#FBF9F5' : bg === 'photo' ? '#FFFFFF' : v.acc};
  if (v.key === 'D') {
    if (bg === 'light') return {m1: '#14120E', m2: '#7A7F87', m3: '#3A3D43', m4: '#FFB547'};
    if (bg === 'brand') return {m1: '#14120E', m2: '#8A6A2A', m3: '#4A3712', m4: '#FFFFFF'};
    return {m1: '#F2F1EE', m2: '#A7ACB4', m3: '#5C616B', m4: '#FFB547'};
  }
  if (bg === 'brand') return {m1: '#FFFFFF', m2: '#FFFFFF', m3: '#FFFFFF'};
  return {m1: '#2E4BFF', m2: '#FF6B2C', m3: '#18B26B'};
}
function stageStyle(v, bg) {
  const light = v.key === 'D' ? '#F2F1EE' : v.key === 'L' ? '#F2EEE7' : '#FFFFFF';
  const dark = v.key === 'L' ? '#1F1D1B' : v.key === 'D' ? '#0E0F11' : '#14161F';
  const map = {
    light: {bg: v.key === 'L' ? v.bg : light, ink: v.key === 'D' ? '#14120E' : v.ink, sub: v.key === 'D' ? '#5C616B' : v.sub},
    dark: {bg: dark, ink: '#F2F1EE', sub: '#9A9EA6'},
    brand: {bg: v.acc, ink: v.acc_ink, sub: v.key === 'D' ? '#5A4A2A' : 'rgba(255,255,255,.75)'},
    photo: {bg: '#333', ink: '#FFFFFF', sub: 'rgba(255,255,255,.8)', img: v.photo}
  };
  return map[bg];
}
function applyVars(el, obj) { for (const k in obj) el.style.setProperty('--' + k, obj[k]); }
function lockHTML(v, sizePx, ink, sub, opts = {}) {
  const W = Math.round(sizePx * 0.62 * v.k), SS = Math.max(9, Math.round(sizePx * 0.15));
  let fix = '', subFix = '';
  if (v.bear) {
    const bL = v.bear.wl * W - v.bear.sl * SS, bR = v.bear.wr * W - v.bear.sr * SS;
    fix = v.ls !== '0' ? `margin-right:-${v.ls};` : '';
    subFix = `min-width:calc(100% - ${(bL + bR).toFixed(2)}px);margin-left:${bL.toFixed(2)}px;`;
  }
  const word = `<span class="w" style="font:${v.fw} ${W}px/0.9 '${v.font}',sans-serif;letter-spacing:${v.ls};${fix}color:${ink}">ПЛАТФОРМА</span>`;
  const subl = `<span class="s" style="color:${sub};font-size:${SS}px;${subFix}">${[...'НЕДВИЖИМОСТИ'].map(c => `<span>${c}</span>`).join('')}</span>`;
  return `<div class="lock ${opts.grid ? 'showgrid' : ''} ${opts.only ? 'only' : ''}" style="color:${ink};gap:${Math.round(sizePx * 0.28)}px">
    <div class="mwrap" style="width:${sizePx}px">${v.mark}${v.grid}</div>
    <div class="words">${word}${subl}</div></div>`;
}
function replay(el) { el.classList.remove('play'); void el.offsetWidth; el.classList.add('play'); }

/* lightbox */
const LB = {set: [], i: 0};
function openLB(set, i) { LB.set = set; LB.i = i; showLB(); $('#lb').classList.add('open'); document.body.style.overflow = 'hidden'; $('#lbX').focus(); }
function showLB() {
  const it = LB.set[LB.i]; const vp = $('#lbV'); vp.classList.remove('z'); $('#lbZ').textContent = '100%';
  $('#lbI').src = it.full; $('#lbI').alt = it.title; $('#lbT').textContent = it.title; $('#lbN').textContent = (LB.i + 1) + ' / ' + LB.set.length; $('#lbD').href = it.full;
}
function closeLB() { $('#lb').classList.remove('open'); document.body.style.overflow = ''; }
function stepLB(d) { LB.i = (LB.i + d + LB.set.length) % LB.set.length; showLB(); }
function zoomLB() { const vp = $('#lbV'); vp.classList.toggle('z'); $('#lbZ').textContent = vp.classList.contains('z') ? 'Вписать' : '100%'; }
$('#lbX').onclick = closeLB; $('#lbP').onclick = () => stepLB(-1); $('#lbNx').onclick = () => stepLB(1); $('#lbZ').onclick = zoomLB;
$('#lbI').addEventListener('click', e => { if (!drag.moved) zoomLB(); });
const drag = {on: false, moved: false};
$('#lbV').addEventListener('pointerdown', e => { const vp = $('#lbV'); if (!vp.classList.contains('z')) return; drag.on = true; drag.moved = false; drag.x = e.clientX; drag.y = e.clientY; drag.sl = vp.scrollLeft; drag.st = vp.scrollTop; vp.style.cursor = 'grabbing'; });
addEventListener('pointermove', e => { if (!drag.on) return; const vp = $('#lbV'); const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true; vp.scrollLeft = drag.sl - dx; vp.scrollTop = drag.st - dy; });
const swipe = {x: null};
$('#lbV').addEventListener('pointerdown', e => { if (!$('#lbV').classList.contains('z')) swipe.x = e.clientX; });
$('#lbV').addEventListener('pointerup', e => { if (swipe.x === null) return; const dx = e.clientX - swipe.x; swipe.x = null; if (Math.abs(dx) > 50) { drag.moved = true; stepLB(dx < 0 ? 1 : -1); setTimeout(() => drag.moved = false, 0); } });
addEventListener('pointerup', () => { if (drag.on) { drag.on = false; $('#lbV').style.cursor = ''; setTimeout(() => drag.moved = false, 0); } });
addEventListener('keydown', e => {
  if (!$('#lb').classList.contains('open')) return;
  if (e.key === 'Escape') closeLB(); else if (e.key === 'ArrowRight') stepLB(1); else if (e.key === 'ArrowLeft') stepLB(-1); else if (e.key === '+' || e.key === '=') zoomLB();
});

/* views */
const ROUTES = [['overview', 'Обзор']].concat(VARS.map(v => ['v' + v.n, v.n + ' · ' + v.title]));
function nav(cur) {
  $('#tabs').innerHTML = ROUTES.map(([id, t]) => `<button type="button" data-r="${id}" aria-current="${id === cur}">${t}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { location.hash = b.dataset.r; });
}
function sheetSet(v) { return v.sheets.map(s => ({full: s.full, title: `${v.n} · ${v.title} «${v.name}» — ${s.label}`})); }

function viewOverview() {
  const cards = VARS.map(v => {
    const st = stageStyle(v, v.key === 'D' ? 'dark' : 'light'); const mv = markVars(v, v.key === 'D' ? 'dark' : 'light');
    return `<article class="card vcard">
      <div class="stage play" style="background:${st.bg}" data-mv='${JSON.stringify(mv)}'><div style="width:120px">${v.mark}</div></div>
      <div class="body"><span class="t">${v.n} · ${v.title} «${v.name}»</span><p>${esc(v.idea)}</p>
        <div class="dots" aria-label="Палитра">${v.palette.map(p => `<i title="${p[0]} ${p[1]}" style="background:${p[1]}"></i>`).join('')}</div>
        <div class="strip" aria-label="Листы варианта">${v.sheets.map((s, i) => `<button type="button" data-ov="${v.n}" data-i="${i}" title="${esc(s.label)}"><img src="${s.th}" alt="${esc(s.label)}" loading="lazy"></button>`).join('')}</div>
        <div class="row"><a class="btn" href="#v${v.n}">Открыть вариант</a></div></div></article>`;
  }).join('');
  return `<div class="kick">Екатеринбург · квартиры, ремонт, каменные дома</div>
    <h1>Варианты фирменного стиля</h1>
    <p class="lead">Шесть вариантов: светлый, тёмный, яркий, две версии «Арки» — с кладкой и со сводом — и «Модуль». У каждого — логотип, стиль и носители, айдентика, сайт и приложение, бренд в жизни. Нажмите на лист, чтобы открыть его крупно, или откройте вариант целиком.</p>
    <div class="grid3">${cards}</div>`;
}

function viewVariant(n) {
  const v = VARS.find(x => x.n === n);
  return `<div class="kick">Вариант ${v.n} из ${VARS.length}</div>
    <div class="row" style="justify-content:space-between;align-items:flex-end"><h1 style="margin:0">${v.title} «${v.name}»</h1></div>
    <p class="lead" style="margin-top:12px">${esc(v.idea)}</p>
    <section class="pg" aria-label="Логотип">
      <div class="stage" id="stage"></div>
      <div class="ctrl">
        <div><div class="lab" id="bgL">Фон</div><div class="seg" role="group" aria-labelledby="bgL" id="bgSeg">
          ${[['light', 'Светлый'], ['dark', 'Тёмный'], ['brand', 'Фирменный'], ['photo', 'Фото']].map(([k, t]) => `<button type="button" data-bg="${k}">${t}</button>`).join('')}</div></div>
        <div><label for="size">Размер знака: <span id="sizeV"></span></label><input type="range" id="size" min="24" max="180" step="2"></div>
        <label class="sw">Только знак<input type="checkbox" id="only"></label>
        <label class="sw">Сетка построения<input type="checkbox" id="grid"></label>
        <button type="button" class="btn" id="play">▶ Анимация знака</button>
      </div>
    </section>
    <h2>Палитра</h2><p class="muted" style="margin:-8px 0 14px">Нажмите на цвет, чтобы скопировать HEX.</p>
    <div class="pal">${v.palette.map(p => `<button type="button" class="sw-c" data-hex="${p[1]}"><span style="background:${p[1]}"></span><b>${p[0]}</b><em>${p[1]}</em></button>`).join('')}</div>
    <h2>Листы</h2>
    <div class="sheets">${v.sheets.map((s, i) => `<button type="button" class="sheet" data-i="${i}"><img src="${s.th}" alt="${esc(s.label)}" loading="lazy"><div>${s.label}<small>${v.n}-${s.s}</small></div></button>`).join('')}</div>
    <div class="links">${n !== '1' ? `<a class="btn ghost" href="#v${+n - 1}">← Вариант ${+n - 1}</a>` : ''}${+n < VARS.length ? `<a class="btn ghost" href="#v${+n + 1}">Вариант ${+n + 1} →</a>` : ''}</div>`;
}
function bindVariant(n) {
  const v = VARS.find(x => x.n === n);
  const st = {bg: store.get('bg' + n, v.key === 'D' ? 'dark' : 'light'), size: +store.get('size' + n, innerWidth < 640 ? 80 : 110), only: store.get('only' + n, '0') === '1', grid: false};
  const draw = (anim) => {
    const s = stageStyle(v, st.bg); const el = $('#stage');
    el.className = 'stage' + (st.bg === 'photo' ? ' photo' : '');
    el.style.background = st.bg === 'photo' ? `#333 url('${s.img}') center/cover` : s.bg;
    el.innerHTML = `<div style="position:relative">${lockHTML(v, st.size, s.ink, s.sub, {grid: st.grid, only: st.only})}</div>`;
    applyVars(el, markVars(v, st.bg));
    $('#bgSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.bg === st.bg));
    $('#sizeV').textContent = st.size + ' px'; $('#size').value = st.size; $('#only').checked = st.only; $('#grid').checked = st.grid;
    fitLock();
    if (anim) replay(el);
  };
  const fitLock = () => {
    const el = $('#stage'); if (!el) return; const lk = el.querySelector('.lock'); if (!lk) return;
    lk.style.transform = 'none';
    const cs = getComputedStyle(el); const avail = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const w = lk.scrollWidth; const k = w > avail ? avail / w : 1; lk.style.transform = k < 1 ? `scale(${k.toFixed(3)})` : 'none';
  };
  window.onresize = fitLock;
  $('#bgSeg').querySelectorAll('button').forEach(b => b.onclick = () => { st.bg = b.dataset.bg; store.set('bg' + n, st.bg); draw(); });
  $('#size').oninput = e => { st.size = +e.target.value; store.set('size' + n, st.size); draw(); };
  $('#only').onchange = e => { st.only = e.target.checked; store.set('only' + n, st.only ? '1' : '0'); draw(); };
  $('#grid').onchange = e => { st.grid = e.target.checked; draw(); };
  $('#play').onclick = () => replay($('#stage'));
  draw(true);
  document.querySelectorAll('.sw-c').forEach(b => b.onclick = () => copy(b.dataset.hex, b.dataset.hex + ' скопирован'));
  const set = sheetSet(v);
  document.querySelectorAll('.sheet').forEach(b => b.onclick = () => openLB(set, +b.dataset.i));
}

function render() {
  const r = (location.hash || '#overview').slice(1);
  const id = ROUTES.some(x => x[0] === r) ? r : 'overview';
  nav(id);
  const app = $('#app');
  if (id === 'overview') app.innerHTML = viewOverview();
  else app.innerHTML = viewVariant(id.slice(1));
  app.querySelectorAll('[data-mv]').forEach(el => applyVars(el, JSON.parse(el.dataset.mv)));
  if (id.startsWith('v')) bindVariant(id.slice(1));
  app.querySelectorAll('[data-ov]').forEach(b => b.onclick = () => openLB(sheetSet(VARS.find(x => x.n === b.dataset.ov)), +b.dataset.i));
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
render();
</script>
</body>
</html>
