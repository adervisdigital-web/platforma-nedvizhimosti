<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Знаки под вкус клиента</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#F3F1ED;color:#1F1D1B;font:400 16px/1.5 Manrope,system-ui,sans-serif}
.wrap{max-width:1440px;margin:0 auto;padding:56px 56px 64px}
h1{font:800 42px/1.05 Manrope,sans-serif;letter-spacing:-.02em;margin:0 0 10px}
p.lead{margin:0 0 30px;color:#6F6A62;max-width:900px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
figure{margin:0}
.tile{aspect-ratio:4/3;border-radius:14px;display:flex;align-items:center;justify-content:center;border:1px solid #0000000f}
figcaption{padding:12px 4px 0}figcaption b{display:block;font:700 16px Manrope,sans-serif}figcaption span{display:block;color:#6F6A62;font-size:14px;line-height:1.45}
.ask{margin-top:30px;background:#1F1D1B;color:#F2EEE7;border-radius:16px;padding:20px 24px;font:600 19px/1.4 Manrope,sans-serif}.ask span{color:#E8B48A}
@media(max-width:900px){.wrap{padding:28px 16px}.grid{grid-template-columns:1fr 1fr}h1{font-size:30px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>Знаки в вашем вкусе</h1>
<p class="lead">По логотипам, которые вам нравятся: тонкая линия, тёмный фон, слово с большой разрядкой и одна находка. Все шесть — про арку-вход и платформу-основу.</p>
<div class="grid"><figure><div class="tile" style="background:#0E0E0F"><div style="display:flex;flex-direction:column;align-items:center;gap:26px"><svg width="86" height="75.9" viewBox="0 0 68 60" role="img" aria-label="Знак П с точкой" style="overflow:visible"><path d="M0 60 V24 A24 24 0 0 1 48 24 V60 H34 V24 A10 10 0 0 0 14 24 V60 Z" fill="#F4F1EC"/><circle cx="61" cy="54" r="6" fill="#E3A57A"/></svg><div style="display:flex;flex-direction:column;align-items:center"><div style="font:300 15px/1 Manrope,sans-serif;letter-spacing:.42em;margin-right:-.42em;color:#F4F1EC;white-space:nowrap">ПЛАТФОРМА</div><div style="font:400 8.5px/1 Manrope,sans-serif;letter-spacing:.5em;margin-right:-.5em;color:#8D8A85;white-space:nowrap;margin-top:9px">НЕДВИЖИМОСТЬ</div></div></div></div><figcaption><b>1 · «П.»</b><span>Скруглённая «П» — арка входа. Точка — это вы: дом, в котором поставили точку в поиске.</span></figcaption></figure><figure><div class="tile" style="background:#141416"><div style="display:flex;flex-direction:column;align-items:center;gap:26px"><svg width="96" height="73.6" viewBox="0 0 60 46" role="img" aria-label="Арка и окно линией" style="overflow:visible"><path d="M2 45 H58" stroke="#E8B48A" stroke-width="1.4" fill="none"/><path d="M14 45 V20 A16 16 0 0 1 46 20 V45" stroke="#E8B48A" stroke-width="1.4" fill="none"/><g fill="#E8B48A"><rect x="26.4" y="27" width="3" height="3"/><rect x="30.6" y="27" width="3" height="3"/><rect x="26.4" y="31.2" width="3" height="3"/><rect x="30.6" y="31.2" width="3" height="3"/></g></svg><div style="display:flex;flex-direction:column;align-items:center"><div style="font:300 15px/1 Manrope,sans-serif;letter-spacing:.42em;margin-right:-.42em;color:#EDE6DC;white-space:nowrap">ПЛАТФОРМА</div><div style="font:400 8.5px/1 Manrope,sans-serif;letter-spacing:.5em;margin-right:-.5em;color:#8A847B;white-space:nowrap;margin-top:9px">НЕДВИЖИМОСТЬ</div></div></div></div><figcaption><b>2 · Линия-дом</b><span>Одна тонкая линия рисует арку и землю, в проёме — светящееся окно. Тепло дома в минимуме средств.</span></figcaption></figure><figure><div class="tile" style="background:#3A3936"><div style="display:flex;flex-direction:column;align-items:center"><div style="font:300 22px/1 Manrope,sans-serif;letter-spacing:.42em;margin-right:-.42em;color:#EDEAE4;white-space:nowrap;display:flex;align-items:flex-end"><svg width="17" height="21" viewBox="0 0 30 37" style="display:inline-block;margin-right:.42em;margin-bottom:2px" aria-label="П"><path d="M2.5 37 V14.5 A12.5 12.5 0 0 1 27.5 14.5 V37" stroke="#C9A66B" stroke-width="3.2" fill="none"/></svg>ЛАТФОРМА</div><div style="font:400 9px/1 Manrope,sans-serif;letter-spacing:.5em;margin-right:-.5em;color:#A49E92;white-space:nowrap;margin-top:9px">НЕДВИЖИМОСТЬ</div></div></div><figcaption><b>3 · Буква-арка</b><span>Отдельного знака нет: первая «П» в слове — тонкая латунная арка. Узнаётся, как TOWER из ваших примеров.</span></figcaption></figure><figure><div class="tile" style="background:#1B2333"><div style="display:flex;flex-direction:column;align-items:center;gap:26px"><svg width="150" height="50.0" viewBox="0 0 120 40" role="img" aria-label="Линия с аркой" style="overflow:visible"><path d="M0 38 H42 V20 A18 18 0 0 1 78 20 V38 H120" stroke="#E9EDF3" stroke-width="1.6" fill="none"/><circle cx="60" cy="31" r="2.6" fill="#E25B4C"/></svg><div style="display:flex;flex-direction:column;align-items:center"><div style="font:300 15px/1 Manrope,sans-serif;letter-spacing:.42em;margin-right:-.42em;color:#E9EDF3;white-space:nowrap">ПЛАТФОРМА</div><div style="font:400 8.5px/1 Manrope,sans-serif;letter-spacing:.5em;margin-right:-.5em;color:#8C97A8;white-space:nowrap;margin-top:9px">НЕДВИЖИМОСТЬ</div></div></div></div><figcaption><b>4 · Линия платформы</b><span>Ровная линия — платформа, основа. В одном месте она поднимается аркой: вход в ваш дом. Красная точка — ваш адрес.</span></figcaption></figure><figure><div class="tile" style="background:#FFFFFF"><div style="display:flex;flex-direction:column;align-items:center;gap:26px"><svg width="96" height="59.7" viewBox="0 0 74 46" role="img" aria-label="Три арки" style="overflow:visible"><path d="M2 45 V22 A16 16 0 0 1 34 22 V45" stroke="#1F3A5F" stroke-width="1.5" fill="none"/><path d="M21 45 V22 A16 16 0 0 1 53 22 V45" stroke="#C4553B" stroke-width="1.5" fill="none"/><path d="M40 45 V22 A16 16 0 0 1 72 22 V45" stroke="#2F6B57" stroke-width="1.5" fill="none"/></svg><div style="display:flex;flex-direction:column;align-items:center"><div style="font:300 15px/1 Manrope,sans-serif;letter-spacing:.42em;margin-right:-.42em;color:#2A2B2E;white-space:nowrap">ПЛАТФОРМА</div><div style="font:400 8.5px/1 Manrope,sans-serif;letter-spacing:.5em;margin-right:-.5em;color:#8A8C90;white-space:nowrap;margin-top:9px">НЕДВИЖИМОСТЬ</div></div></div></div><figcaption><b>5 · Три арки</b><span>Три тонкие арки — квартиры, ремонт, дома. Пересекаются, потому что это одна компания и один путь.</span></figcaption></figure><figure><div class="tile" style="background:#5A564C"><svg width="250" height="92" viewBox="0 0 250 92" role="img" aria-label="Рамка с арочным проёмом"><path d="M30 91 H1 V1 H249 V91 H62 V72 A16 16 0 0 0 30 72 Z" stroke="#E6DED2" stroke-width="1.3" fill="none"/><text x="84" y="44" font-family="Manrope" font-weight="300" font-size="15" letter-spacing="4.6" fill="#E6DED2">ПЛАТФОРМА</text><text x="84" y="62" font-family="Manrope" font-weight="400" font-size="7" letter-spacing="3.9" fill="#B8AE9F">НЕДВИЖИМОСТЬ</text></svg></div><figcaption><b>6 · Рамка с проёмом</b><span>Тонкая рамка — участок, план, витрина. В углу вырезан арочный вход: всё, что внутри, — ваше.</span></figcaption></figure></div>
<div class="ask">Какой ближе? Ответьте номером — <span>например, «4», или «2, но на синем»</span>.</div>
</div></body></html>
